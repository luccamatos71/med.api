[project]
name = "med-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt>=4.3.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.14",
    "fastapi>=0.136.1",
    "fsrs>=6.3.1",
    "openai>=2.38.0",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "email-validator>=2.2.0",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.9.0",
    "pymupdf>=1.27.2.3",
    "sentry-sdk[fastapi]>=2.60.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
